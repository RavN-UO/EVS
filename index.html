<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVS — Nos primes, notre priorité</title>

<!-- Icône / ajout à l'écran d'accueil (nom : EVS). Les fichiers d'icônes et le
     manifest doivent être enregistrés dans le même dossier que index.html. -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8c2a52">
<meta name="apple-mobile-web-app-title" content="EVS">
<meta name="application-name" content="EVS">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  /* ============================================================
     Variables
     ============================================================ */
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #d4dae0;
    --text: #2b2b30;
    --muted: #6a6470;
    --accent: #8c2a52;
    --accent-dark: #6d2040;
    --total-bg: #5a2147;
    --total-bg2: #8c2a52;
    --reset-bg: #f0edf1;
    --stripe-dark: #2b2b30;
    --rest: #1f6f7a;       /* compteur de repos neutre (teal) */
    --rest-bg: #e8f3f4;
    --dp: #4a5da6;         /* jour avec découché (DP) : trajet retour annulé (indigo doux) */
    --dp-bg: #eef1fb;
    --ok: #1f8a4c;         /* repos suffisant (vert) */
    --ok-bg: #e6f4ec;
    --bad: #c0392b;        /* repos insuffisant (rouge) */
    --bad-bg: #fbeae8;
  }

  /* ============================================================
     Base
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    padding: 16px;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  /* ============================================================
     En-tête : cadre rayé + slogan
     ============================================================ */
  header {
    margin-bottom: 18px;
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 4px;
  }

  /* Angle de cadre = un seul fond rayé (donc parfaitement aligné) découpé
     en forme de cadre via un masque : barre verticale + amorces haut/bas.
     La marge négative rapproche la barre du texte tout en gardant des
     amorces horizontales longues. */
  .bracket {
    flex: 0 0 30px;
    width: 30px;
    background: repeating-linear-gradient(
      -45deg,
      var(--accent) 0 12px,
      var(--stripe-dark) 12px 24px
    );
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    -webkit-mask-image: linear-gradient(#000, #000), linear-gradient(#000, #000), linear-gradient(#000, #000);
            mask-image: linear-gradient(#000, #000), linear-gradient(#000, #000), linear-gradient(#000, #000);
    -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
    -webkit-mask-size: 20px 100%, 30px 16px, 30px 16px;
            mask-size: 20px 100%, 30px 16px, 30px 16px;
  }
  .bracket.left {
    margin-right: -7px;
    -webkit-mask-position: left center, left top, left bottom;
            mask-position: left center, left top, left bottom;
  }
  .bracket.right {
    margin-left: -7px;
    -webkit-mask-position: right center, right top, right bottom;
            mask-position: right center, right top, right bottom;
  }

  .banner-text {
    text-align: center;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .banner-text .b-line1 {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    line-height: 1.2;
    text-transform: uppercase;
  }
  .banner-text .b-line2 {
    font-size: 1.95rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: 0.05em;
    text-indent: 0.05em;
    line-height: 1.05;
    text-transform: uppercase;
  }

  /* ============================================================
     Onglets
     ============================================================ */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    border-bottom: 2px solid var(--border);
  }
  .tab-btn {
    flex: 1 1 auto;
    background: none;
    border: none;
    padding: 12px 10px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel[hidden] { display: none; }

  /* ============================================================
     Période (onglet EVS)
     ============================================================ */
  .period { margin-bottom: 16px; }
  .period label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .period-print { display: none; } /* visible uniquement à l'impression */

  /* ============================================================
     Champs de saisie
     ============================================================ */
  input[type="text"],
  input[type="date"],
  .field-input {
    width: 100%;
    font-size: 1.05rem;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(140, 42, 82, 0.18);
  }

  /* Sélecteur de date un peu plus soigné */
  input[type="date"] {
    accent-color: var(--accent);
    font-weight: 600;
    color: var(--accent-dark);
    background: linear-gradient(0deg, #fbf6f8, #ffffff);
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    opacity: 0.85;
  }
  input[type="date"]::-webkit-calendar-picker-indicator:hover {
    background: var(--reset-bg);
    opacity: 1;
  }

  /* ============================================================
     Cartes (primes EVS + sections Déplacement)
     ============================================================ */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card .label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
  }
  .card .name { font-weight: 600; font-size: 1.1rem; color: var(--accent-dark); }

  /* Légères couleurs dans le formulaire EVS (lisibilité) */
  #primes .card { border-left: 4px solid var(--accent); }
  #primes .line-total-val { color: var(--accent-dark); }

  /* Taux horaire (carte Traitement) */
  .rate-hour {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 10px;
    padding: 8px 12px;
    background: var(--reset-bg);
    border-radius: 10px;
  }
  .rate-hour .rh-label { font-size: 0.85rem; color: var(--muted); font-weight: 600; flex: 1 1 auto; }
  .rate-hour .rh-hint { font-weight: 400; font-size: 0.72rem; color: var(--muted); }
  .rate-hour .rh-val { font-weight: 700; color: var(--accent); font-size: 1.05rem; white-space: nowrap; }

  /* Éléments visibles uniquement à l'impression (taux horaire dans la colonne
     Taux du Traitement + cale d'alignement à la place de la quantité). */
  .print-rate-h, .print-qty-spacer { display: none; }

  /* Indemnité de résidence : champ discret (ne sert qu'au taux horaire) */
  .field-residence label { font-style: italic; font-size: 0.72rem; }
  .field-residence .field-input {
    font-size: 0.85rem;
    padding: 7px 9px;
    border-style: dashed;
    border-color: #e0d4db;
    background: #faf7f9;
    color: var(--muted);
  }

  .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
  }
  .del-btn:hover { color: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    align-items: end;
  }
  .grid .field label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .line-total {
    margin-top: 10px;
    text-align: right;
    font-size: 1.15rem;
    font-weight: 600;
  }
  .line-total .lbl {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 400;
    margin-right: 6px;
  }

  /* ============================================================
     Ajout d'une ligne
     ============================================================ */
  .add-row { margin: 4px 0 16px; }
  .add-btn {
    width: 100%;
    background: #fff;
    border: 1px dashed var(--accent);
    color: var(--accent);
    padding: 13px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
  }
  .add-form {
    display: none;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .add-form.show { display: block; }
  .add-form .af-field { margin-bottom: 10px; }
  .add-form label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .add-form .af-actions { display: flex; gap: 10px; }

  /* ============================================================
     Total général (EVS)
     ============================================================ */
  .grand-total {
    background: linear-gradient(135deg, var(--total-bg), var(--total-bg2));
    color: #fff;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin: 20px 0;
  }
  .grand-total .gt-label {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.85rem;
    opacity: 0.9;
  }
  .grand-total .gt-value {
    font-size: 2.4rem;
    font-weight: 700;
    margin-top: 4px;
  }

  /* ============================================================
     Résumé (compteurs agrégés EVS)
     ============================================================ */
  .summary {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .summary-title {
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.9rem;
  }
  .sum-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .sum-row:last-child { border-bottom: none; }
  .sum-row .sum-label { font-size: 0.9rem; }
  .sum-row .sum-val { font-weight: 700; color: var(--accent-dark); white-space: nowrap; }

  /* ============================================================
     Boutons d'action
     ============================================================ */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  button.btn {
    flex: 1 1 auto;
    min-width: 140px;
    font-size: 1rem;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--reset-bg);
    color: var(--text);
    cursor: pointer;
  }
  button.btn:active { transform: translateY(1px); }
  button.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.btn.primary:hover { background: var(--accent-dark); }

  /* ============================================================
     Onglet Simulateur de déplacement (lignes compactes)
     ============================================================ */
  .date-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .date-bar label { font-size: 0.95rem; font-weight: 600; color: var(--muted); white-space: nowrap; }

  /* Champ date : on n'affiche JAMAIS le texte natif (« jj/mm/aaaa » ou la date)
     — le champ <input type="date"> ne sert qu'au calendrier. On peint par-dessus
     notre propre libellé (« Calendrier » si vide, la date choisie sinon).
     flex-basis 0 + min-width 0 = le champ occupe toujours toute la largeur
     disponible (sinon, sur mobile, il se réduit à la taille de son contenu). */
  .date-input-wrap { position: relative; flex: 1 1 0%; min-width: 0; }
  .date-input-wrap input[type="date"] {
    width: 100%;
    min-width: 0;
    padding: 9px 12px;
    box-sizing: border-box;
    color: transparent;   /* masque le texte natif (jj/mm/aaaa) hors focus */
  }
  /* Webkit : le « jj/mm/aaaa » réapparaît au focus malgré color:transparent ;
     on masque carrément la zone d'édition (l'icône calendrier reste visible). */
  .date-input-wrap input[type="date"]::-webkit-datetime-edit { opacity: 0; }
  .date-input-wrap .date-ph {
    position: absolute;
    left: 12px;
    right: 40px;          /* laisse l'icône calendrier visible à droite */
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none; /* le clic atteint le champ -> ouvre le calendrier */
    color: var(--muted);  /* aspect « placeholder » tant que vide */
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Date saisie : le libellé prend l'aspect d'une valeur. */
  .date-input-wrap.filled .date-ph { color: var(--accent-dark); }

  .day-card { padding: 8px 10px; margin-bottom: 8px; }
  /* En-tête : [switch Jour/Nuit + date + RP]  ....  [amplitude + reset]. */
  .day-card .label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border);
  }
  .day-head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .day-switch { font-size: 0.9rem; flex: 0 0 auto; }
  .day-card .name { font-size: 0.95rem; color: var(--accent-dark); }
  .day-card .day-name-wrap .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .day-head-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex: 0 0 auto;
  }
  /* Réinitialisation du jour : flèche qui tourne, discrète (ne ressort pas). */
  .reset-day-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.05rem;
    line-height: 1;
    padding: 0 2px;
    color: var(--muted);
    opacity: 0.6;
  }
  .reset-day-btn:active { transform: translateY(1px); }
  .day-amp {
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    font-size: 0.95rem;
    padding: 2px 10px;
    border-radius: 999px;
  }

  /* Ligne éditable : Aller | Début | Coupure | Fin | Retour (clic = saisie).
     Cellules en colonne (valeur au-dessus, libellé en dessous), ~2 lignes de
     haut pour des cibles tactiles confortables. La colonne Coupure (juste un
     petit switch) est plus étroite pour laisser de la place aux 4 horaires. */
  .day-edit {
    display: grid;
    grid-template-columns: 1fr 1fr 0.62fr 1fr 1fr;
    gap: 3px;
    align-items: stretch;
    margin-top: 6px;
  }
  /* min-width:0 = indispensable : sans ça les colonnes refusent de rétrécir
     sous la largeur intrinsèque de l'input et la valeur est tronquée. */
  .de-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 2px;
    min-height: 38px;
    min-width: 0;
  }
  .de-input {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    text-align: center;
    /* taille fluide : suit la largeur de l'écran mais reste petite et bornée,
       de sorte que « 00h00 » tient toujours dans la case. */
    font-size: clamp(0.6rem, 3vw, 0.8rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    padding: 5px 1px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--accent-dark);
    -webkit-appearance: none;
    appearance: none;
  }
  .de-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(140, 42, 82, 0.18);
  }
  .de-lbl {
    font-size: 0.52rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  /* Ligne d'actions sous les saisies : Service J-1 / Trajet J-1. */
  .day-actions { display: flex; gap: 8px; margin-top: 8px; }
  .day-actions .dup-btn { flex: 1 1 auto; text-align: center; }

  /* Case RP (journée non travaillée) */
  .rp-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--rest);
    cursor: pointer;
  }
  .rp-toggle input { width: 16px; height: 16px; accent-color: var(--rest); }
  .day-card.rp { background: var(--rest-bg); border-color: var(--rest); }

  /* Case DP (découché) : à gauche du compteur d'heures, annule le trajet retour. */
  .dp-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--dp);
    cursor: pointer;
  }
  .dp-toggle input { width: 16px; height: 16px; accent-color: var(--dp); }
  /* Champ horaire désactivé (ex. Retour quand DP est coché) : grisé. */
  .de-input:disabled { opacity: 0.4; background: #f2f2f4; cursor: not-allowed; }

  /* Coupure (cellule de la ligne éditable) : switch compact + libellé « Coupure ». */
  .coupure-switch { flex: 0 0 auto; }
  .coupure-switch .track { width: 32px; height: 18px; }
  .coupure-switch .track::after { width: 14px; height: 14px; }
  .coupure-switch input:checked + .track::after { left: 16px; }

  /* Bascule Jour / Nuit */
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 700;
  }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track {
    width: 40px;
    height: 22px;
    border-radius: 999px;
    background: #c9b6c1;
    position: relative;
    transition: background .15s;
    flex: 0 0 auto;
  }
  .switch .track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    transition: left .15s;
  }
  .switch input:checked + .track { background: var(--accent-dark); }
  .switch input:checked + .track::after { left: 20px; }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 3px rgba(140, 42, 82, 0.25); }
  .switch .sw-text { color: var(--text); }

  /* Libellé du jour + badge nuit (jour précédent / jour) */
  .day-name-wrap { display: flex; align-items: baseline; gap: 8px; flex-wrap: nowrap; min-width: 0; }
  .night-badge {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent-dark);
    background: #f3e6ec;
    border-radius: 6px;
    padding: 1px 6px;
  }

  /* Compteur de temps de repos entre deux jours.
     Neutre (gris doux) quand vide, vert si repos suffisant, rouge sinon. */
  .rest-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 0 8px;
    padding: 5px 12px;
    background: #eef0f3;
    border: 1px dashed #b7bcc6;
    border-radius: 999px;
    font-size: 0.85rem;
  }
  .rest-row .rest-label { color: #767b85; font-weight: 600; }
  .rest-row .rest-value { color: #767b85; font-weight: 700; }
  .rest-row .rest-icon { font-weight: 800; font-size: 1.05rem; line-height: 1; color: #767b85; }
  .rest-row.ok { background: var(--ok-bg); border-color: var(--ok); }
  .rest-row.ok .rest-label,
  .rest-row.ok .rest-value,
  .rest-row.ok .rest-icon { color: var(--ok); }
  .rest-row.bad { background: var(--bad-bg); border-color: var(--bad); }
  .rest-row.bad .rest-label,
  .rest-row.bad .rest-value,
  .rest-row.bad .rest-icon { color: var(--bad); }

  /* Bouton « Dupliquer service J-1 » (recopie service + coupure). */
  .dup-btn {
    border: 1px dashed var(--accent);
    background: #fff;
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
    line-height: 1.2;
  }
  .dup-btn:active { transform: translateY(1px); }

  /* Vue calendrier : grille 7 colonnes (lundi -> dimanche). Les jours saisis se
     placent dans la bonne colonne ; un tap fait défiler jusqu'à la carte du jour.
     Reconstruite dans compute(). */
  .cal {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 16px;
  }
  .cal:empty { display: none; }
  .cal-head {
    text-align: center;
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .cal-day {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-height: 40px;
    padding: 4px 2px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font: inherit;
  }
  .cal-day .cal-num { font-size: 0.72rem; font-weight: 700; color: var(--accent-dark); }
  .cal-day .cal-amp { font-size: 0.58rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .cal-day.rp { background: var(--rest-bg); border-color: var(--rest); }
  .cal-day.rp .cal-amp { color: var(--rest); }
  .cal-day.dp { background: var(--dp-bg); border-color: var(--dp); }
  .cal-day.dp .cal-amp { color: var(--dp); }
  .cal-day:active { transform: translateY(1px); }
  /* Repère de repos entre deux jours : flèche verte (OK) / croix rouge (insuffisant). */
  .cal-mark {
    position: absolute;
    left: -7px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.8rem;
    font-weight: 800;
    line-height: 1;
    z-index: 1;
  }
  .cal-mark.ok { color: var(--ok); }
  .cal-mark.bad { color: var(--bad); }
  /* Flèche « sortante » (bord droit) : départ du jour qui précède une période RP. */
  .cal-mark.leave { left: auto; right: -7px; }
  /* Pictogramme déplacement (coin haut-droit) : 🚐 jour de découché (DP),
     🍔 jour travaillé de retour suivant un découché. */
  .cal-icon {
    position: absolute;
    top: 1px;
    right: 2px;
    font-size: 0.72rem;
    line-height: 1;
    z-index: 1;
    pointer-events: none;
  }

  /* Case de fin de calendrier : « + » ajoute le jour suivant, « − » supprime le dernier. */
  .cal-add {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 40px;
    padding: 2px;
    border: 1px dashed var(--accent);
    border-radius: 8px;
    background: #fff;
  }
  .cal-add-btn {
    border: none;
    background: none;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--accent);
  }
  .cal-add-btn:active { transform: translateY(1px); }
  /* « − » sous la dernière case du calendrier : supprime le dernier jour. */
  .cal-rem {
    position: absolute;
    bottom: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 20px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #fff;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    z-index: 2;
  }
  .cal-rem:active { transform: translateX(-50%) translateY(1px); }

  /* Surbrillance brève de la carte ciblée depuis le bandeau. */
  .day-card.flash { box-shadow: 0 0 0 3px rgba(140, 42, 82, 0.35); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin: 24px 0 8px;
  }

  /* ============================================================
     Responsive
     ============================================================ */
  @media (max-width: 420px) {
    .grand-total .gt-value { font-size: 2rem; }
  }

  /* ============================================================
     Impression / export PDF de l'onglet EVS (compact, une page)
     ============================================================ */
  @media print {
    /* marge à 0 = le navigateur n'imprime plus son en-tête (titre) ni son
       pied de page (chemin du fichier) ; on remet une marge interne. */
    @page { margin: 0; }
    body {
      background: #fff;
      padding: 10mm 12mm;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .wrap { max-width: none; }

    .tabs, #tab-deplacement,
    .actions, .add-btn, .add-row, .add-form, .del-btn, .period,
    .rate-hour, .field-residence, footer {
      display: none !important;
    }

    /* En-tête conservé (cadre rayé + slogan) : mêmes proportions que sur le
       site (police et cadre inchangés) pour un rendu PDF identique au web. */
    header { margin-bottom: 5mm; }

    /* Période affichée dans le PDF. */
    .period-print {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4mm;
    }

    /* Une ligne par prime, compact. Largeurs FIXES pour que les libellés
       Taux/Quantité/Total ne bougent pas selon les valeurs saisies
       (jamais plus de 6 chiffres et une virgule). */
    .card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
      margin-bottom: 4px;
      border: 1px solid #d8c4cf;
      break-inside: avoid;
    }
    .card:nth-child(even) { background: #f7eef2; }
    .card .label-row { margin: 0; flex: 1 1 auto; min-width: 0; }
    .card .name { font-size: 0.95rem; color: var(--accent-dark); }
    .card .grid {
      display: flex;
      gap: 12px;
      margin: 0;
      flex: 0 0 auto;
      grid-template-columns: none;
    }
    .card .grid .field { display: flex; align-items: baseline; gap: 4px; flex: 0 0 auto; }
    .card .grid .field label { font-size: 0.7rem; margin: 0; color: var(--muted); }
    .card .grid input {
      width: 64px;            /* largeur fixe : « 123456, » max */
      border: none;
      padding: 0;
      font-size: 0.9rem;
      background: transparent;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .line-total {
      margin: 0;
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 0.95rem;
    }
    .line-total .lbl { font-size: 0.7rem; color: var(--muted); margin: 0; }
    .line-total-val {
      color: var(--accent-dark);
      display: inline-block;
      width: 88px;           /* largeur fixe pour le montant en € */
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Ligne Traitement : la colonne Taux affiche le TAUX HORAIRE (aligné avec
       les taux des autres lignes grâce à la cale en lieu et place de la
       quantité) ; le montant du traitement reste à droite, dans Total. */
    .card .taux-traitement input { display: none; }
    .card .taux-traitement .print-rate-h {
      display: inline-block;
      width: 64px;
      text-align: right;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
      color: var(--accent-dark);
    }
    .card .print-qty-spacer {
      display: flex;
      visibility: hidden;     /* occupe la place de la quantité sans l'afficher */
      flex: 0 0 auto;
    }

    .grand-total {
      background: var(--accent) !important;
      color: #fff;
      border: none;
      padding: 10px;
      margin: 8px 0 0;
    }
    .grand-total .gt-value { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bracket left" aria-hidden="true"></div>
    <div class="banner-text">
      <div class="b-line1">Nos primes,</div>
      <div class="b-line2">notre priorité</div>
    </div>
    <div class="bracket right" aria-hidden="true"></div>
  </header>

  <nav class="tabs">
    <button type="button" class="tab-btn active" data-tab="evs">EVS</button>
    <button type="button" class="tab-btn" data-tab="deplacement">Simulateur de déplacement</button>
  </nav>

  <!-- ============================ Onglet EVS ============================ -->
  <section id="tab-evs" class="tab-panel">
    <div class="period">
      <label for="period">Période</label>
      <input type="text" id="period" placeholder="Ex. Mai 2026" autocomplete="off">
    </div>
    <div class="period-print" id="periodPrint"></div>

    <div id="primes"></div>

    <div class="add-row">
      <button type="button" class="add-btn" id="addPrimeToggle">＋ Ajouter une ligne</button>
    </div>

    <div class="add-form" id="addForm">
      <div class="af-field">
        <input type="text" id="newName" autocomplete="off" placeholder="Nom de la ligne">
      </div>
      <div class="af-field">
        <label for="newRate">Taux (€)</label>
        <input type="text" id="newRate" inputmode="decimal" autocomplete="off" placeholder="0,00">
      </div>
      <div class="af-actions">
        <button type="button" class="btn" id="addCancel">Annuler</button>
        <button type="button" class="btn primary" id="addConfirm">Ajouter</button>
      </div>
    </div>

    <div class="grand-total">
      <div class="gt-label">Total</div>
      <div class="gt-value" id="grandTotal">0,00 €</div>
    </div>

    <div class="summary" id="summary">
      <div class="summary-title">Résumé</div>
    </div>

    <div class="actions">
      <button type="button" class="btn" id="resetAll">Réinitialiser</button>
      <button type="button" class="btn primary" id="pdfBtn">Exporter en PDF</button>
    </div>
  </section>

  <!-- ================== Onglet Simulateur de déplacement ================== -->
  <section id="tab-deplacement" class="tab-panel" hidden>
    <div class="date-bar">
      <label for="firstDate">📅 Date</label>
      <div class="date-input-wrap">
        <input type="date" id="firstDate">
        <span class="date-ph">Calendrier</span>
      </div>
    </div>

    <div id="days"></div>

    <div class="actions">
      <button type="button" class="btn" id="resetDep">Réinitialiser</button>
    </div>
  </section>

  <footer>IPSO-UPTX-SUD — Juin 2026</footer>
</div>

<script>
/* =====================================================================
   Navigation par onglets
   ===================================================================== */
(function () {
  "use strict";
  var buttons = document.querySelectorAll(".tab-btn");
  var panels = {
    evs: document.getElementById("tab-evs"),
    deplacement: document.getElementById("tab-deplacement")
  };

  function activate(name) {
    buttons.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === name); });
    Object.keys(panels).forEach(function (k) { panels[k].hidden = (k !== name); });
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () { activate(b.getAttribute("data-tab")); });
  });

  activate("evs"); // EVS par défaut
})();

/* =====================================================================
   Onglet EVS — calculateur de primes
   ===================================================================== */
(function () {
  "use strict";

  var STORAGE_KEY = "calcul-evs-v1";

  // Primes par défaut. `id` stable pour la persistance ; `fixedQty` = quantité
  // bloquée à 1 et masquée (cas du Traitement).
  var DEFAULT_PRIMES = [
    { id: "traitement",      name: "Traitement",          rate: 0,    fixedQty: true },
    { id: "indemnite-local", name: "Indemnité local UPTX", rate: 435 },
    { id: "txidf",           name: "Tx IDF",              rate: 13.82 },
    { id: "repas",           name: "Repas",               rate: 20.50 },
    { id: "conduite",        name: "Conduite (taux A)",   rate: 4.86 },
    { id: "weekends",        name: "Week-ends",           rate: 110.00 },
    { id: "castor",          name: "CASTOR",              rate: 52 },
    { id: "deplacements",    name: "Déplacements",        rate: 82.00 },
    { id: "tunnel",          name: "Tunnel",              rate: 0.99 }
  ];

  var euro = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
  // Même nombre mais sans le symbole € (utilisé pour le taux horaire à l'impression).
  var decimal2 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // ---- Helpers de nombres -------------------------------------------------

  // Saisie texte (virgule ou point) -> nombre >= 0, ou 0 si vide/invalide.
  function parseNum(str) {
    if (str === null || str === undefined) return 0;
    str = String(str).trim().replace(/\s/g, "").replace(",", ".");
    if (str === "") return 0;
    var n = parseFloat(str);
    return (isNaN(n) || n < 0) ? 0 : n;
  }

  // Nombre -> texte de champ (virgule française, sans symbole).
  function numToInput(n) {
    return String(n).replace(".", ",");
  }

  // ---- État + persistance -------------------------------------------------

  var state = { period: "", residence: "", primes: [] };

  // Diviseur du calcul de taux horaire : (Traitement + indemnité résidence) / 140.
  var HOURLY_DIVISOR = 140;

  function makeDefault(d) {
    return {
      id: d.id,
      name: d.name,
      rate: d.rate,
      qty: d.fixedQty ? 1 : 0,
      fixedQty: !!d.fixedQty,
      custom: false
    };
  }

  function loadState() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); }
    catch (e) { saved = null; }

    var savedById = {};
    if (saved && Array.isArray(saved.primes)) {
      saved.primes.forEach(function (p) { if (p && p.id) savedById[p.id] = p; });
      state.period = saved.period || "";
      var r = saved.residence;
      state.residence = (r === undefined || r === null || r === "") ? ""
        : (typeof r === "number" ? numToInput(r) : String(r));
    }

    // Reconstruit dans l'ordre des primes par défaut (garantit l'affichage des
    // nouvelles primes même si des taux sont déjà enregistrés), en réappliquant
    // les valeurs sauvegardées, puis ajoute les primes personnalisées.
    state.primes = DEFAULT_PRIMES.map(function (d) {
      var base = makeDefault(d);
      var s = savedById[d.id];
      if (s) {
        if (s.rate !== undefined) base.rate = parseNum(s.rate);
        if (!base.fixedQty && s.qty !== undefined) base.qty = parseNum(s.qty);
      }
      return base;
    });

    if (saved && Array.isArray(saved.primes)) {
      saved.primes.forEach(function (p) {
        if (p && p.custom) {
          state.primes.push({
            id: p.id,
            name: p.name,
            rate: parseNum(p.rate),
            qty: parseNum(p.qty),
            fixedQty: false,
            custom: true
          });
        }
      });
    }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* stockage indisponible : on continue sans persistance */ }
  }

  function findDefault(id) {
    for (var i = 0; i < DEFAULT_PRIMES.length; i++) {
      if (DEFAULT_PRIMES[i].id === id) return DEFAULT_PRIMES[i];
    }
    return null;
  }

  // ---- Calculs ------------------------------------------------------------

  function lineTotal(p) { return p.rate * p.qty; }

  function grandTotal() {
    var g = 0;
    state.primes.forEach(function (p) { g += lineTotal(p); });
    return g;
  }

  // Compteurs du résumé : libellé + somme des totaux de certaines primes.
  var SUMMARY = [
    { label: "IND JOURNALIERE TRANSPORT PERSONNEL", ids: ["conduite"] },
    { label: "ALLOC DE DEPLACEMENT REGIME GENERAL", ids: ["deplacements", "repas"] },
    { label: "INDEMNITE LOCALE (Week-ends + CASTOR)", ids: ["weekends", "castor"] },
    { label: "INDEMNITE LOCALE (UPTX)", ids: ["indemnite-local"] }
  ];

  // Somme des totaux de ligne des primes désignées par leurs id.
  function sumForIds(ids) {
    var byId = {};
    state.primes.forEach(function (p) { byId[p.id] = p; });
    var t = 0;
    ids.forEach(function (id) { if (byId[id]) t += lineTotal(byId[id]); });
    return t;
  }

  // ---- Rendu --------------------------------------------------------------

  var primesEl = document.getElementById("primes");
  var grandTotalEl = document.getElementById("grandTotal");
  var summaryEl = document.getElementById("summary");
  var periodEl = document.getElementById("period");
  var periodPrintEl = document.getElementById("periodPrint");

  // Construit (une fois) les lignes du résumé ; valeurs mises à jour ensuite.
  function buildSummary() {
    SUMMARY.forEach(function (row, i) {
      var r = document.createElement("div");
      r.className = "sum-row";
      var lab = document.createElement("span");
      lab.className = "sum-label";
      lab.textContent = row.label;
      var val = document.createElement("span");
      val.className = "sum-val";
      val.id = "sum-" + i;
      r.appendChild(lab);
      r.appendChild(val);
      summaryEl.appendChild(r);
    });
  }

  function updateSummary() {
    SUMMARY.forEach(function (row, i) {
      var el = document.getElementById("sum-" + i);
      if (el) el.textContent = euro.format(sumForIds(row.ids));
    });
  }

  // Construit un champ « label + input numérique ».
  function buildField(labelText, id, value, onInput) {
    var field = document.createElement("div");
    field.className = "field";

    var label = document.createElement("label");
    label.textContent = labelText;
    label.setAttribute("for", id);

    var input = document.createElement("input");
    input.type = "text";
    input.inputMode = "decimal";
    input.className = "field-input";
    input.id = id;
    input.value = value ? numToInput(value) : "";
    input.placeholder = "0";
    input.addEventListener("input", function () { onInput(input.value); });

    field.appendChild(label);
    field.appendChild(input);
    return field;
  }

  function buildCard(p, index) {
    var card = document.createElement("div");
    card.className = "card";

    // Libellé (+ bouton supprimer pour les primes personnalisées).
    var labelRow = document.createElement("div");
    labelRow.className = "label-row";
    var nameWrap = document.createElement("div");
    var name = document.createElement("span");
    name.className = "name";
    name.textContent = p.name;
    nameWrap.appendChild(name);
    labelRow.appendChild(nameWrap);

    if (p.custom) {
      var del = document.createElement("button");
      del.type = "button";
      del.className = "del-btn";
      del.setAttribute("aria-label", "Supprimer " + p.name);
      del.textContent = "✕";
      del.addEventListener("click", function () {
        state.primes.splice(index, 1);
        saveState();
        render();
      });
      labelRow.appendChild(del);
    }
    card.appendChild(labelRow);

    // Taux + quantité (quantité masquée si fixe).
    var grid = document.createElement("div");
    grid.className = "grid";

    var rateField = buildField("Taux (€)", "rate-" + p.id, p.rate, function (v) {
      p.rate = parseNum(v);
      refreshTotals();
      saveState();
    });
    if (p.fixedQty) {
      // Traitement : à l'impression, la colonne Taux affiche le taux horaire.
      rateField.classList.add("taux-traitement");
      var printRh = document.createElement("span");
      printRh.className = "print-rate-h";
      printRh.id = "printTauxHoraire";
      rateField.appendChild(printRh);
    }
    grid.appendChild(rateField);

    if (p.fixedQty) {
      // Traitement : 2e colonne = indemnité de résidence (pas de quantité).
      var resField = buildField("Indemnité de résidence - sans complément (€)", "residence", null, function (v) {
        state.residence = v;
        refreshTotals();
        saveState();
      });
      // valeur initiale = chaîne saisie telle quelle
      resField.querySelector("input").value = state.residence;
      resField.classList.add("field-residence");
      grid.appendChild(resField);

      // Cale (impression uniquement) : occupe la colonne « Quantité » des autres
      // lignes pour que le taux horaire s'aligne avec les autres taux.
      var spacer = document.createElement("div");
      spacer.className = "field print-qty-spacer";
      var spLbl = document.createElement("label");
      spLbl.textContent = "Quantité";
      var spIn = document.createElement("input");
      spIn.type = "text";
      spIn.tabIndex = -1;
      spIn.setAttribute("aria-hidden", "true");
      spacer.appendChild(spLbl);
      spacer.appendChild(spIn);
      grid.appendChild(spacer);
    } else {
      grid.appendChild(buildField("Quantité", "qty-" + p.id, p.qty, function (v) {
        p.qty = parseNum(v);
        refreshTotals();
        saveState();
      }));
    }
    card.appendChild(grid);

    // Taux horaire = (Traitement + indemnité de résidence) / 140 (Traitement only),
    // calculé seulement quand l'indemnité de résidence est renseignée.
    if (p.fixedQty) {
      var rh = document.createElement("div");
      rh.className = "rate-hour";
      var rhLbl = document.createElement("span");
      rhLbl.className = "rh-label";
      rhLbl.innerHTML = 'Taux horaire <span class="rh-hint">(renseigner le traitement + l’indemnité de résidence)</span>';
      var rhVal = document.createElement("span");
      rhVal.className = "rh-val";
      rhVal.id = "tauxHoraire";
      rh.appendChild(rhLbl);
      rh.appendChild(rhVal);
      card.appendChild(rh);
    }

    // Total de la ligne.
    var total = document.createElement("div");
    total.className = "line-total";
    var lbl = document.createElement("span");
    lbl.className = "lbl";
    lbl.textContent = "Total";
    var val = document.createElement("span");
    val.className = "line-total-val";
    val.setAttribute("data-id", p.id);
    val.textContent = euro.format(lineTotal(p));
    total.appendChild(lbl);
    total.appendChild(val);
    card.appendChild(total);

    return card;
  }

  function render() {
    primesEl.innerHTML = "";
    state.primes.forEach(function (p, index) {
      primesEl.appendChild(buildCard(p, index));
    });
    refreshTotals();
  }

  // Met à jour les totaux affichés sans tout reconstruire.
  function refreshTotals() {
    var byId = {};
    state.primes.forEach(function (p) { byId[p.id] = p; });

    var vals = primesEl.querySelectorAll(".line-total-val");
    for (var i = 0; i < vals.length; i++) {
      var p = byId[vals[i].getAttribute("data-id")];
      if (p) vals[i].textContent = euro.format(lineTotal(p));
    }
    grandTotalEl.textContent = euro.format(grandTotal());
    updateSummary();

    // Taux horaire : seulement si l'indemnité de résidence est renseignée.
    // À l'écran (#tauxHoraire) avec le symbole € ; à l'impression
    // (#printTauxHoraire) sans le symbole €.
    var rhScreen = "", rhPrint = "";
    if (byId.traitement && String(state.residence).trim() !== "") {
      var th = (byId.traitement.rate + parseNum(state.residence)) / HOURLY_DIVISOR;
      rhScreen = euro.format(th);
      rhPrint = decimal2.format(th);
    }
    var rhEl = document.getElementById("tauxHoraire");
    if (rhEl) rhEl.textContent = rhScreen;
    var printRhEl = document.getElementById("printTauxHoraire");
    if (printRhEl) printRhEl.textContent = rhPrint;
  }

  function updatePeriodPrint() {
    var v = (state.period || "").trim();
    periodPrintEl.textContent = v ? "Période : " + v : "";
  }

  // ---- Actions ------------------------------------------------------------

  periodEl.addEventListener("input", function () {
    state.period = periodEl.value;
    updatePeriodPrint();
    saveState();
  });

  // Réinitialise taux, quantités et période aux valeurs par défaut.
  document.getElementById("resetAll").addEventListener("click", function () {
    state.primes.forEach(function (p) {
      var def = findDefault(p.id);
      if (def) {
        p.rate = def.rate;
        p.qty = def.fixedQty ? 1 : 0;
      } else {
        p.qty = 0; // prime personnalisée : quantité remise à zéro
      }
    });
    state.period = "";
    state.residence = "";
    periodEl.value = "";
    updatePeriodPrint();
    saveState();
    render();
  });

  // Pendant la frappe : ne garde que les chiffres (max 4) et insère le « h »
  // après les 2 premiers chiffres -> "0730" devient "07h30".
  function formatTime(v) {

    return h * 60 + m;

  function span(startMin, endMin) {

  // L'aller est annulé pour un découché (DP) qui suit déjà un DP : l'agent est
  // déjà sur place, il n'y a pas de trajet d'arrivée ce jour-là.
  function allerCancelled(i) {
    var day = state.days[i];

  // Début / fin de journée « prise de service » (trajet inclus s'il est saisi).
  function dayStart(day, i) {

  function dayEnd(day) {

    if (day.dp) return toMinutes(day.e);

      if (!restVal) return;

      var p = prevWorked(next);         // dernier jour travaillé avant lui
      var rest = restBefore(next);

      // Couleur : vert si repos suffisant, rouge sinon. Le temps ajouté par
      // d'éventuelles journées RP (chacune +24h) est INDICATIF et retiré du

      info.textContent = day.rp ? "RP" : dayAmpText(day, i);
      cell.appendChild(info);

      // Pictogramme déplacement : 🚐 le jour de découché (DP) ; 🍔 le jour
      // travaillé de retour (1er jour travaillé non-DP suivant un découché).
      var picto = "";
      if (day.dp) {
        picto = "🚐";
      } else if (!day.rp) {
        var pw = prevWorked(i);
        if (pw !== null && state.days[pw].dp) picto = "🍔";
      }
      if (picto) {
        var ic = document.createElement("span");
        ic.className = "cal-icon";
        ic.textContent = picto;
        cell.appendChild(ic);
      }

      // Repère de repos ENTRANT (bord gauche) : flèche verte / croix rouge
      // avant la reprise du travail (englobe d'éventuels jours RP intercalés).
      if (!day.rp) {
        var st = restStatusInto(i);
        if (st) {
          var mark = document.createElement("span");
          mark.className = "cal-mark " + st;
          mark.textContent = (st === "ok") ? "→" : "✕";
          cell.appendChild(mark);
        }

        // Repère SORTANT (bord droit) : flèche verte qui part du jour précédant
        // une période RP, quand le repos qui suit est suffisant (vert uniquement).
        var nxt = nextWorked(i);
        if (nxt !== null && nxt > i + 1 && restStatusInto(nxt) === "ok") {
          var leave = document.createElement("span");
          leave.className = "cal-mark leave ok";
          leave.textContent = "→";
          cell.appendChild(leave);
        }
      }

      // « − » sous la case du dernier jour : supprime ce dernier jour.
      if (i === state.days.length - 1 && state.days.length > 1) {
        var rem = document.createElement("button");
        rem.type = "button";
        rem.className = "cal-rem";
        rem.textContent = "−";
        rem.setAttribute("aria-label", "Supprimer le dernier jour");
        rem.addEventListener("click", function (e) {
          e.stopPropagation();
          removeLastDay();
        });
        cell.appendChild(rem);
      }

      cell.addEventListener("click", function () {
        var card = document.getElementById("dayCard-" + i);
        if (!card) return;
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        card.classList.add("flash");
        setTimeout(function () { card.classList.remove("flash"); }, 1000);
      });

      calEl.appendChild(cell);
    });

    // Case de contrôle en fin de calendrier (toujours sur le créneau suivant) :
    // « + » ajoute un jour ; « − » supprime le dernier (si plus d'un jour).
    var addCell = document.createElement("div");
    addCell.className = "cal-add";
    var addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "cal-add-btn";
    addBtn.textContent = "+";
    addBtn.setAttribute("aria-label", "Ajouter un jour");
    addBtn.addEventListener("click", addDay);
    addCell.appendChild(addBtn);
    calEl.appendChild(addCell);
  }

  // ---- Initialisation -----------------------------------------------------

  // Date « YYYY-MM-DD » -> « 02 juin 2026 » (ou "" si vide/invalide).
  function fmtDateFr(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" });
  }

  // Met à jour le libellé peint par-dessus le champ date : « Calendrier » tant
  // qu'aucune date n'est saisie, sinon la date choisie (le texte natif du champ
  // reste invisible en permanence — voir CSS).
  function syncDatePlaceholder() {
    var wrap = firstDateEl.parentNode;
    if (!wrap || !wrap.classList.contains("date-input-wrap")) return;
    var ph = wrap.querySelector(".date-ph");
    var iso = firstDateEl.value;
    wrap.classList.toggle("filled", !!iso);
    if (ph) ph.textContent = iso ? fmtDateFr(iso) : "Calendrier";
  }

  function onDateChanged() {
    state.firstDate = firstDateEl.value;
    syncDatePlaceholder();
    saveState();
    renderDays(); // met à jour les libellés de date
  }

  state = loadState();

  firstDateEl.value = state.firstDate;
  syncDatePlaceholder();
  // « change » + « input » : couvre tous les navigateurs (desktop et mobile).
  firstDateEl.addEventListener("change", onDateChanged);
  firstDateEl.addEventListener("input", onDateChanged);
  // Tout le champ ouvre le calendrier (pas seulement la petite icône).
  firstDateEl.parentNode.addEventListener("click", function () {
    if (typeof firstDateEl.showPicker === "function") {
      try { firstDateEl.showPicker(); } catch (e) { /* geste requis : ignoré */ }
    }
  });

  // Réinitialise tout le simulateur : date effacée et 5 jours vides.
  document.getElementById("resetDep").addEventListener("click", function () {
    state = defaultState();
    firstDateEl.value = "";
    syncDatePlaceholder();
    saveState();
    renderDays();
  });

  renderDays();
})();
</script>
</body>
</html>
